# Render Blueprint — deploys the Express + TypeScript backend + the Vite static
# frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# VITE_API_BASE_URL is baked into the frontend bundle at build time (also set in
# frontend/.env.production as the reliable default). The backend allows any
# *.onrender.com origin out of the box (see corsOrigins in backend/src/config.ts);
# set FRONTEND_URL only for a custom domain.

services:
  # ---------- Backend (Express + TypeScript) ----------
  - type: web
    name: akesriram-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required so TypeScript (a devDependency) is available to
    # compile the build; Render sets NODE_ENV=production which otherwise skips it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: FRONTEND_URL
        sync: false          # set to your static site URL after first deploy
      - key: GITHUB_TOKEN
        sync: false          # optional
      - key: NVIDIA_NIM_API_KEY
        sync: false          # optional (fallback used if empty)
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: BREVO_API_KEY
        sync: false          # optional
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        value: akesurekha@gmail.com

  # ---------- Frontend (Vite static build) ----------
  - type: web
    name: akesriram-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://akesriram-api.onrender.com
    routes:
      # SPA fallback so any path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
